# One-off, manual-only: produces the .alf activation request that is exchanged for the .ulf
# licence at https://license.unity3d.com/manual. Rerun it whenever the Unity version changes.
# The full procedure is in the root README under "CI".
name: Acquire activation file

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.13f1

      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
